[project]
name = "agentropy-api"
version = "0.1.0"
description = "Agentropy backend API: OTLP ingest, traces, insights engine, billing, workspaces"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    # Needed to decode OTLP/protobuf payloads on POST /v1/traces.
    "opentelemetry-proto>=1.28",
    # Insight engine (LangGraph state graph).
    "langgraph>=0.2",
    # SaaS database client (users, workspaces, keys, subscriptions).
    "supabase>=2.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "httpx>=0.27",
    "pyjwt>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
]
